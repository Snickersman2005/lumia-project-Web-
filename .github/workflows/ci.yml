name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lumia .
      - name: Smoke test
        run: |
          docker run -d --name lumia -p 3000:3000 -e ADMIN_PASSWORD=ci-password-1234567890 lumia
          for i in $(seq 1 20); do curl -fsS http://localhost:3000/healthz && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:3000/cs/
