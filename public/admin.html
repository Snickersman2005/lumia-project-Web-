<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LUMIA — администрирование</title>
<style>
:root{--bg:#F6F1EE;--card:#fff;--ink:#2A1F2D;--muted:#6F6272;--line:#E5D9D5;--plum:#3B2A3F;--violet:#7A5AA6;--ok:#2F7D5B;--err:#B3382C;--warn:#B7791F}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input[type=checkbox]{width:auto}input[type=color]{padding:2px;height:38px}
.btn{border:0;background:var(--plum);color:#fff;padding:9px 18px;border-radius:999px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--plum);border:1.5px solid var(--plum)}.btn.danger{background:var(--err)}.btn.sm{padding:6px 14px;font-size:.85rem}
.login{max-width:360px;margin:12vh auto;background:var(--card);padding:32px;border-radius:20px;display:grid;gap:14px;box-shadow:0 10px 30px rgba(59,42,63,.1)}
.top{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--plum);color:#fff;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.top b{letter-spacing:.15em}.top a{color:#E9D8E8;margin-left:auto}
.nav{display:flex;gap:6px;flex-wrap:wrap;padding:14px 24px 0}
.nav button{border:0;background:transparent;padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.nav button.on{background:var(--plum);color:#fff}
.nav .cnt{background:var(--err);color:#fff;border-radius:999px;padding:0 7px;font-size:.75rem;margin-left:6px}
main{padding:20px 24px 60px;max-width:1100px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.item>summary{padding:14px 18px;cursor:pointer;display:flex;gap:12px;align-items:center;list-style:none}
.item>summary::-webkit-details-marker{display:none}
.item>summary b{flex:1}.item>summary small{color:var(--muted)}
.item form{padding:6px 18px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;border-top:1px solid var(--line)}
.f{display:grid;gap:4px}.f label{font-size:.8rem;font-weight:700;color:var(--muted)}.f.wide{grid-column:1/-1}
.f.chk{display:flex;align-items:center;gap:8px}.f.chk label{order:2}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}.checks label{font-weight:400;color:var(--ink);display:flex;gap:6px;align-items:center}
.acts{grid-column:1/-1;display:flex;gap:10px;align-items:center}
.pill{padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:700;background:#eee}
.pill.new{background:#FDEBC8;color:#8a5a00}.pill.confirmed{background:#D8EEE2;color:var(--ok)}.pill.done{background:#E3E0F3;color:#4b3b86}.pill.cancelled,.pill.noshow{background:#F5D7D3;color:var(--err)}
.pill.off{background:#eee;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:.9rem}
th{background:#FAF5F2;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tw{overflow-x:auto}
.msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--plum);color:#fff;padding:12px 22px;border-radius:999px;display:none;z-index:99}
.msg.err{background:var(--err)}
.note{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:16px;font-size:.9rem}
.g-ok{color:var(--ok)}.g-bad{color:var(--err)}
.trbox{border:1px dashed var(--line);border-radius:12px;padding:10px 14px}.trbox summary{cursor:pointer;font-weight:700;color:var(--violet)}.trlang{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.trlang>b{grid-column:1/-1}
h2{margin:6px 0 14px}
</style>
</head>
<body>
<div id="app"></div>
<div class="msg" id="msg" role="status"></div>
<script src="/admin.js"></script>
</body>
</html>
